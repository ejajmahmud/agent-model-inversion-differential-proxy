[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-model-inversion-differential-proxy"
version = "0.1.0"
description = "Output sanitizer preventing model inversion attacks by applying differential privacy noise to high-entropy classification outputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-model-inversion-differential-proxy = "agent_model_inversion_differential_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_model_inversion_differential_proxy*"]
